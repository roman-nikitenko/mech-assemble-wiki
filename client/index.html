<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preload the display font so its download starts during HTML parse
         instead of after the CSS loads and lays out text. `crossorigin` is
         required on font preloads even same-origin, or the browser fetches it
         twice. Path/type must match the @font-face in src/index.css. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Nasalization-Regular.woff2"
      crossorigin
    />
    <!-- Rajdhani is the site-wide body/UI font; preload the two most-used
         weights (400 body, 700 bold) so above-the-fold text swaps in fast.
         The other weights (300/500/600) stay on the CSS/swap path. Paths must
         match the @font-face rules in src/index.css. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/rajdhani-v17-latin-regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/rajdhani-v17-latin-700.woff2"
      crossorigin
    />
    <title>Mech Assemble Wiki</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
